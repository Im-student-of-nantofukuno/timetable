<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>時間割連絡システム</title>
    <link rel="stylesheet" href="style.css" />
    <script src="timetable_changes.js" defer></script>
    <script src="script.js" defer></script>
    <!--supabase関連 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="supabase_client.js"></script>
  
  </head>
  <body>
    <div class="app-shell" data-view="student">
      <header class="top-bar" aria-label="画面上部">
          <section class="profile-controls" id="student-profile-controls" aria-label="表示対象">
          <label class="profile-chip profile-chip--grade">
            <span>年:</span>
            <select id="student-grade" name="grade">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="teacher">先生</option>
            </select>
          </label>

          <label class="profile-chip profile-chip--class">
            <span>組:</span>
            <select id="student-class" name="class">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
            </select>
          </label>

          <label class="profile-chip profile-chip--course">
            <span>コース:</span>
            <select id="student-course" name="course">
              <option value="none">なし</option>
              <option value="humanities" selected>文系</option>
              <option value="science">理系</option>
              <option value="explore-humanities">探文</option>
              <option value="explore-science">探理</option>
              <option value="agriculture">農</option>
              <option value="welfare">福</option>
            </select>
          </label>
          <label
            class="profile-chip profile-chip--teacher"
            id="student-teacher-control"
            hidden
          >
            <span>ID:</span>

            <div class="teacher-picker" id="teacher-picker">

              <!-- 現在の選択内容 -->
              <button
                type="button"
                class="teacher-picker-button"
                id="teacher-picker-button"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span id="teacher-picker-label">
                  選択してください
                </span>
                <span class="teacher-picker-arrow">▼</span>
              </button>

              <!-- プルダウン本体 -->
              <div
                class="teacher-picker-menu"
                id="teacher-picker-menu"
                hidden
              >

                <!-- 検索欄 -->
                <div class="teacher-picker-search">
                  <input
                    type="search"
                    id="teacher-picker-search"
                    placeholder="先生を検索..."
                    autocomplete="off"
                  >
                </div>

                <!-- 候補一覧 -->
                <div
                  class="teacher-picker-options"
                  id="teacher-picker-options"
                  role="listbox"
                ></div>

              </div>

              <!-- 既存JSとの互換用 -->
              <select
                id="student-teacher"
                name="teacher"
                hidden
              >
                <option value="">選択してください</option>
              </select>

            </div>
          </label>
        </section>

        <nav class="view-actions" aria-label="画面切り替え">
          <button class="icon-button" type="button" data-view-button="student" aria-label="生徒画面">
            <span aria-hidden="true">👁</span>
          </button>
          <button class="icon-button" type="button" data-view-button="login" aria-label="管理者ログイン">
            <span aria-hidden="true">✎</span>
          </button>
        
          <button
            class="icon-button info-icon-button"
            type="button"
            id="student-info-button"
            aria-label="ドキュメントを開く"
          >
            <img src="info.jpg" alt="" />
          </button>
        
          <button class="icon-button" type="button" data-view-button="quick-admin" aria-label="浅い管理画面">
            <span aria-hidden="true">🛠</span>
          </button>
        
          <button class="icon-button" type="button" data-view-button="deep-admin" aria-label="深い管理画面">
            <span aria-hidden="true">⚙</span>
          </button>
        </nav>
      </header>

      <main>
        <section class="screen screen--student" id="student-screen" data-screen="student" aria-labelledby="student-heading">
          <h1 class="visually-hidden" id="student-heading">生徒用時間割画面</h1>

          <section class="timetable-panel" aria-labelledby="student-timetable-heading">

            <div class="panel-title">
              <label class="profile-chip profile-chip--day">
                <select id="student-day" name="day">
                  <option value="月">月</option>
                  <option value="火">火</option>
                  <option value="水">水</option>
                  <option value="木">木</option>
                  <option value="金">金</option>
                </select>
              </label>

              <h2 id="student-timetable-heading">時間割</h2>
            </div>

          <div id="student-day-warning" class="student-day-warning"></div>

          <ol class="period-list">
            <li>
              <span class="period-number">1</span>
              <span class="period-subject" data-period="1"></span>
            </li>
            <li>
              <span class="period-number">2</span>
              <span class="period-subject" data-period="2"></span>
            </li>
            <li>
              <span class="period-number">3</span>
              <span class="period-subject" data-period="3"></span>
            </li>
            <li>
              <span class="period-number">4</span>
              <span class="period-subject" data-period="4"></span>
            </li>
            <li>
              <span class="period-number">5</span>
              <span class="period-subject" data-period="5"></span>
            </li>
            <li>
              <span class="period-number">6</span>
              <span class="period-subject" data-period="6"></span>
            </li>
            <li>
              <span class="period-number">7</span>
              <span class="period-subject" data-period="7"></span>
            </li>
          </ol>

        </section>

          <section class="notice-panel" aria-labelledby="student-notice-heading">
            <div class="panel-title">
              <span aria-hidden="true">🔔</span>
              <h2 id="student-notice-heading">お知らせ</h2>
              <div class="notice-grid" id="student-notices"></div>
            </div>
          </section>
        </section>

        <section class="screen screen--login" id="login-screen" data-screen="login" aria-labelledby="login-heading" hidden>
          <div class="login-card">
            <h1 id="login-heading">管理者ログイン</h1>
            <p>管理者用Googleアカウントでログインしてください。</p>
            <button type="button" id="google-login-button">Googleでログイン</button>
            <p id="login-message"></p>
          </div>
        </section>

        <section class="screen screen--quick-admin" id="quick-admin-screen" data-screen="quick-admin" aria-labelledby="quick-admin-heading" hidden>
          <header class="admin-header">
            <label class="profile-chip profile-chip--grade">
              <span>学年:</span>
              <select id="admin-grade" name="admin-grade">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
              </select>
            </label>

            <label class="profile-chip">
              <span>曜日:</span>
              <select id="admin-day" name="admin-day">
                <option value="月">月</option>
                <option value="火">火</option>
                <option value="水">水</option>
                <option value="木">木</option>
                <option value="金">金</option>
              </select>
            </label>
          </header>

          <section class="admin-layout">
            <section class="matrix-panel" aria-labelledby="quick-admin-heading">
              <h1 class="visually-hidden" id="quick-admin-heading">浅い管理画面</h1>
              <div class="timetable-matrix" id="change-matrix" role="grid" aria-label="時間割変更表"></div>
            </section>

            <aside class="admin-side-panel" aria-labelledby="quick-side-heading">
              <div class="panel-title">
                <span aria-hidden="true">🔔</span>
                <h2 id="quick-side-heading">お知らせ</h2>
              </div>

              <div class="segmented-control" role="tablist" aria-label="投稿種別">
                <button type="button" role="tab" aria-selected="true" data-admin-mode="notice">お知らせ</button>
                <button type="button" role="tab" aria-selected="false" data-admin-mode="history">変更履歴</button>
              </div>

              <div class="admin-post-list" aria-label="投稿済み一覧">
              </div>

              <form class="post-form">
                <label>
                  <span>タイトル</span>
                  <input type="text" name="post-title" placeholder="SS科より連絡" />
                </label>
                <label>
                  <span>本文</span>
                  <textarea name="post-body" rows="5" placeholder="連絡内容を入力"></textarea>
                </label>
                <label>
                <span>掲載開始</span>
                  <input type="date" name="post-start" />
                </label>

                <label>
                <span>掲載終了</span>
                <input type="date" name="post-end" />
                </label>
                <details class="target-settings">
                  <summary id="target-summary">対象: 2年 / 全組 / 全</summary>
                  <fieldset>
                    <legend>対象学年</legend>
                    <label><input type="checkbox" name="target-grade" value="1" />1年</label>
                    <label><input type="checkbox" name="target-grade" value="2" checked />2年</label>
                    <label><input type="checkbox" name="target-grade" value="3" />3年</label>
                  </fieldset>
                  <fieldset>
                    <legend>対象組</legend>
                    <label><input type="checkbox" name="target-class" value="all" checked />全組</label>
                    <label><input type="checkbox" name="target-class" value="1" />1組</label>
                    <label><input type="checkbox" name="target-class" value="2" />2組</label>
                    <label><input type="checkbox" name="target-class" value="3" />3組</label>
                    <label><input type="checkbox" name="target-class" value="4" />4組</label>
                    <label><input type="checkbox" name="target-class" value="5" />5組</label>
                    <label><input type="checkbox" name="target-class" value="6" />6組</label>
                    <label><input type="checkbox" name="target-class" value="7" />7組</label>
                  </fieldset>
                  <fieldset>
                    <legend>対象文理</legend>
                    <label><input type="checkbox" name="target-course" value="all" checked />全</label>
                    <label><input type="checkbox" name="target-course" value="none" />なし</label>
                    <label><input type="checkbox" name="target-course" value="humanities" />文系</label>
                    <label><input type="checkbox" name="target-course" value="science" />理系</label>
                    <label><input type="checkbox" name="target-course" value="explore-humanities" />探文</label>
                    <label><input type="checkbox" name="target-course" value="explore-science" />探理</label>
                  </fieldset>
                </details>
                <button type="submit">投稿する</button>
              </form>
            </aside>
          </section>
        </section>

        <section class="screen screen--deep-admin" id="deep-admin-screen" data-screen="deep-admin" aria-labelledby="deep-admin-heading" hidden>
          <header class="deep-admin-header">
            <label class="profile-chip profile-chip--grade">
              <span>学年:</span>
              <select id="deep-admin-grade" name="deep-admin-grade">
                <option value="1">1</option>
                <option value="2" selected>2</option>
              <option value="3">3</option>
              </select>
            </label>

            <label class="profile-chip profile-chip--day">
              <span>曜日:</span>
              <select id="deep-admin-day" name="deep-admin-day">
                <option value="月" selected>月</option>
                <option value="火">火</option>
                <option value="水">水</option>
                <option value="木">木</option>
                <option value="金">金</option>
              </select>
            </label>

            <h1 id="deep-admin-heading">深い編集画面</h1>
          </header>

          <section class="admin-layout">
            <section class="matrix-panel" aria-label="基本時間割編集">
              <div
                class="timetable-matrix timetable-matrix--base"
                id="base-matrix"
                role="grid"
                aria-label="基本時間割"
              ></div>
            </section>

            <aside class="admin-side-panel" aria-labelledby="admin-profile-list-heading">
              <div class="panel-title">
                <span aria-hidden="true">👤</span>
                <h2 id="admin-profile-list-heading">管理者</h2>
              </div>

              <button type="button" id="add-admin-profile">
                管理者を追加する
              </button>

              <ul class="admin-profile-list" id="admin-profile-list"></ul>
            </aside>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
